<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
  <div class="wrapper">
    <nav class="navbar">
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="boardgames.html">All Boardgames</a></li>
        <li><a href="profile.html">Profile</a></li>
      </ul>
    </nav>

    <h1>User Profile</h1>

    <label for="userSelect">Select User:</label>
    <select id="userSelect">
      <option value="">--Choose a user--</option>
    </select>

    <div id="userCollection">
      <h2>User Collection</h2>
      <table class="collection-table" id="collectionTable">
        <thead>
          <tr>
            <th>Boardgame</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const userSelect = document.getElementById('userSelect');
    const collectionTableBody = document.querySelector('#collectionTable tbody');

    fetch('http://localhost:8080/api/boardgameUsers')
      .then(response => response.json())
      .then(users => {
        users.forEach(user => {
          const option = document.createElement('option');
          option.value = user.id;
          option.textContent = user.name;
          userSelect.appendChild(option);
        });
      })
      .catch(err => console.error('Error fetching users:', err));

    userSelect.addEventListener('change', () => {
      const userId = userSelect.value;
      collectionTableBody.innerHTML = '';

      if (!userId) return;

      fetch(`http://localhost:8080/api/boardgameUsers/${userId}/boardgameCopies`)
        .then(response => response.json())
        .then(copies => {
          copies.forEach(copy => {
            const tr = document.createElement('tr');

            const boardgameTd = document.createElement('td');
            boardgameTd.textContent = copy.boardgameTitle;

            const statusTd = document.createElement('td');
            statusTd.textContent = copy.status;
            statusTd.className = copy.status === 'AVAILABLE' ? 'status-available' : 'status-unavailable';

            tr.appendChild(boardgameTd);
            tr.appendChild(statusTd);
            collectionTableBody.appendChild(tr);
          });
        })
        .catch(err => console.error('Error fetching collection:', err));
    });
  </script>
</body>
</html>
